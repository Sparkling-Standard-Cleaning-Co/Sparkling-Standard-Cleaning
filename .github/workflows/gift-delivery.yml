name: gift-delivery

# The endpoint enforces 09:00 America/Chicago and idempotent delivery. The
# hourly trigger lets the same code follow daylight-saving transitions.
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deliver:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger due gift deliveries
        env:
          GIFT_DELIVERY_URL: ${{ secrets.GIFT_DELIVERY_URL }}
          GIFT_OWNER_TOKEN: ${{ secrets.GIFT_OWNER_TOKEN }}
        run: |
          if [ -z "$GIFT_DELIVERY_URL" ] || [ -z "$GIFT_OWNER_TOKEN" ]; then
            echo "Scheduled gift delivery is not configured; skipping."
            exit 0
          fi
          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-delay 10 \
            -X POST "$GIFT_DELIVERY_URL" \
            -H "Authorization: Bearer $GIFT_OWNER_TOKEN" \
            -H "Accept: application/json"
