name: Encrypted off-site backup

# This workflow is dormant until the owner adds the repository secrets listed
# in docs/operations/OFFSITE-BACKUPS.md. It never runs against local customer
# data and never sends a backup to a public GitHub artifact.

on:
  schedule:
    - cron: '30 8 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: encrypted-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_NAME: ${{ secrets.D1_DATABASE_NAME }}
      BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
      BACKUP_R2_ENDPOINT: ${{ secrets.BACKUP_R2_ENDPOINT }}
      BACKUP_R2_BUCKET: ${{ secrets.BACKUP_R2_BUCKET }}
      BACKUP_R2_ACCESS_KEY_ID: ${{ secrets.BACKUP_R2_ACCESS_KEY_ID }}
      BACKUP_R2_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require backup configuration
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "CLOUDFLARE_API_TOKEN missing" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "CLOUDFLARE_ACCOUNT_ID missing" && exit 1)
          test -n "$D1_DATABASE_NAME" || (echo "D1_DATABASE_NAME missing" && exit 1)
          test -n "$BACKUP_ENCRYPTION_KEY" || (echo "BACKUP_ENCRYPTION_KEY missing" && exit 1)
          test -n "$BACKUP_R2_BUCKET" || (echo "BACKUP_R2_BUCKET missing" && exit 1)
      - name: Export production D1
        run: |
          mkdir -p backup-out
          npx --yes wrangler@4 d1 export "$D1_DATABASE_NAME" --remote --output backup-out/d1.sql
          test -s backup-out/d1.sql
      - name: Verify the D1 export restores independently
        run: node scripts/backup/verify-d1-export.mjs backup-out/d1.sql
      - name: Create and upload encrypted backup
        run: node scripts/backup/create.mjs --d1 backup-out/d1.sql --out backup-out --upload
      - name: Verify the encrypted archive locally
        run: |
          ARCHIVE=$(node -e "const r=require('./backup-out/last-backup.json'); process.stdout.write(r.archive)")
          node scripts/backup/verify.mjs "$ARCHIVE"
      - name: Record the backup result
        run: |
          node -e "const r=require('./backup-out/last-backup.json'); console.log(JSON.stringify({createdAt:r.createdAt,fileCount:r.fileCount,plainBytes:r.plainBytes,archiveSha256:r.archiveSha256,uploaded:Boolean(r.upload)},null,2))"
      - name: Report backup success to operations
        if: success()
        env:
          OPS_ALERT_URL: ${{ secrets.OPS_ALERT_URL }}
          OPS_ALERT_TOKEN: ${{ secrets.OPS_ALERT_TOKEN }}
          RUN_KEY: github-backup-${{ github.run_id }}
        run: |
          if [ -z "$OPS_ALERT_URL" ] || [ -z "$OPS_ALERT_TOKEN" ]; then
            echo "Backup status reporting is not configured; skipping."
            exit 0
          fi
          SUMMARY=$(node -e "const r=require('./backup-out/last-backup.json'); process.stdout.write('Encrypted backup created: ' + r.fileCount + ' files, uploaded=' + Boolean(r.upload))")
          jq -n --arg runKey "$RUN_KEY" --arg summary "$SUMMARY" \
            '{runKey: $runKey, status: "success", summary: $summary}' > /tmp/backup-status.json
          curl -fsS -X POST "$OPS_ALERT_URL/api/internal/backup-status" \
            -H "Authorization: Bearer $OPS_ALERT_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/backup-status.json
      - name: Report backup failure to operations
        if: failure()
        env:
          OPS_ALERT_URL: ${{ secrets.OPS_ALERT_URL }}
          OPS_ALERT_TOKEN: ${{ secrets.OPS_ALERT_TOKEN }}
          RUN_KEY: github-backup-${{ github.run_id }}
        run: |
          if [ -z "$OPS_ALERT_URL" ] || [ -z "$OPS_ALERT_TOKEN" ]; then
            echo "Backup status reporting is not configured; skipping."
            exit 0
          fi
          jq -n --arg runKey "$RUN_KEY" \
            '{runKey: $runKey, status: "failure", summary: "Encrypted backup workflow failed or did not complete."}' > /tmp/backup-status.json
          curl -fsS -X POST "$OPS_ALERT_URL/api/internal/backup-status" \
            -H "Authorization: Bearer $OPS_ALERT_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/backup-status.json
