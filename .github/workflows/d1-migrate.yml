name: Apply production D1 migrations

# Exceptional infrastructure operation. Routine owner work must not require
# GitHub, but schema changes are applied in order before deploying code that
# reads the new objects. The operator must type APPLY to confirm.

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type APPLY to run the pending migrations
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-d1-migrations
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: inputs.confirmation == 'APPLY'
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_NAME: ${{ secrets.D1_DATABASE_NAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require migration configuration
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "CLOUDFLARE_API_TOKEN missing" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "CLOUDFLARE_ACCOUNT_ID missing" && exit 1)
          test -n "$D1_DATABASE_NAME" || (echo "D1_DATABASE_NAME missing" && exit 1)
      - name: Resolve the production database id
        run: |
          set -o pipefail
          DATABASE_ID=$(curl -fsS \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database?name=${D1_DATABASE_NAME}" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            | jq -r --arg name "$D1_DATABASE_NAME" '.result[] | select(.name == $name) | .uuid' | head -n1)
          test -n "$DATABASE_ID" || (echo "D1 database id could not be resolved" && exit 1)
          jq -n --arg name "$D1_DATABASE_NAME" --arg id "$DATABASE_ID" \
            '{d1_databases:[{binding:"DB",database_name:$name,database_id:$id,migrations_dir:"migrations"}]}' \
            > wrangler.ci.jsonc
      - name: Show pending migrations
        run: npx --yes wrangler@4 d1 migrations list DB --remote --config wrangler.ci.jsonc
      - name: Apply pending migrations
        run: npx --yes wrangler@4 d1 migrations apply DB --remote --config wrangler.ci.jsonc
      - name: Verify production schema state
        run: |
          npx --yes wrangler@4 d1 execute DB --remote --config wrangler.ci.jsonc --command \
            "SELECT COUNT(*) AS migrations FROM d1_migrations; SELECT COUNT(*) AS tables FROM sqlite_master WHERE type = 'table' AND name NOT LIKE 'sqlite_%';"
      - name: Verify foreign-key integrity
        run: |
          npx --yes wrangler@4 d1 execute DB --remote --config wrangler.ci.jsonc --command \
            "PRAGMA foreign_key_check;"
