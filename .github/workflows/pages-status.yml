name: Pages deployment status

# Read-only deployment inspection for the owner/reviewer. Never changes a
# project, branch, domain or environment variable.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: List Pages projects
        run: |
          set -o pipefail
          curl -fsS \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            | jq '.result | map({name, production_branch: .production_branch, subdomain: .subdomain, domains: .domains, latest_deployment: (.latest_deployment | {id, short_id, environment, created_on, modified_on, url, stages})})'
      - name: List recent deployments for the Sparkling Standard project
        run: |
          set -o pipefail
          PROJECT=$(curl -fsS \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            | jq -r '.result[] | select(.name | test("sparkling"; "i")) | .name' | head -n1)
          test -n "$PROJECT" || (echo "Sparkling project not found" && exit 1)
          echo "Project: $PROJECT"
          curl -fsS \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PROJECT}/deployments?per_page=10" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            | jq '.result | map({id, short_id, environment, created_on, modified_on, url, commit_hash: .deployment_trigger.metadata.commit_hash, commit_message: .deployment_trigger.metadata.commit_message, branch: .deployment_trigger.metadata.branch})'
