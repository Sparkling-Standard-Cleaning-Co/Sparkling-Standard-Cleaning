# Validation pipeline — runs on every push and pull request.
# Deployment is handled by the owner's Cloudflare project, not by this workflow.

name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run check
      - name: Estimator unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Static site validation (links, SEO, QRs, checklist leaks)
        run: npm run validate
      - name: Smoke test
        run: npm run smoke
      - name: Fake-testimonial detector
        run: node scripts/check-fake-testimonials.mjs
      - name: No-fabrication audit
        run: node scripts/audit-facts.mjs

  # Browser regression suite (Playwright) — Sparkling Standard 4.0 §3D.
  # The full journey/wizard/booking/address/analytics suites run against a
  # built static preview. This catches UI, estimator and quote-flow regressions
  # that type checks and DOM-less tests cannot.
  browser:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser regression suite (builds the site first)
        run: npm run test:browser

