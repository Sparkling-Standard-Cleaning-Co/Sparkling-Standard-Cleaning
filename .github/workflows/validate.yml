# Validation pipeline - runs on every push and pull request.
# Cloudflare Pages deploys independently from main, but its `npm run build`
# executes the same config:validate prebuild gate, so invalid owner pricing
# cannot be published even if this workflow is still running.

name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate estimator configuration
        run: npm run config:validate
      - name: Type check
        run: npm run check
      - name: Estimator unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Pricing impact preview
        if: github.event_name == 'push'
        continue-on-error: true
        run: npm run pricing:impact -- --compare HEAD^
      - name: Static site validation (links, SEO, QRs, checklist leaks)
        run: npm run validate
      - name: Smoke test
        run: npm run smoke
      - name: Fake-testimonial detector
        run: node scripts/check-fake-testimonials.mjs
      - name: No-fabrication audit
        run: node scripts/audit-facts.mjs

  # Browser regression suite (Playwright) — Sparkling Standard 4.0 §3D.
  # The full journey/wizard/booking/address/analytics suites run against a
  # built static preview. This catches UI, estimator and quote-flow regressions
  # that type checks and DOM-less tests cannot.
  browser:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser regression suite (builds the site first)
        run: npm run test:browser

